services:
  postgres:
    image: postgres:17-alpine
    container_name: pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: monorepox
    ports:
      - 5432:5432
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d monorepox"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  pg:
